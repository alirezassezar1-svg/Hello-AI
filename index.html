<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NONONICK ID</title>
<meta name="description" content="هویت دیجیتال علیرضا — Nononick">
<style>
  :root{
    --bg:#000; --text:#f4f7ff; --muted:#8e9ab8;
    --cyan:#35e8ff; --violet:#9b6bff; --green:#4dffb0; --pink:#ff5fd2; --amber:#ffc24d; --err:#ff7a7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg)}
  body{
    min-height:100dvh; color:var(--text);
    font-family:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    display:flex; justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
    background:
      radial-gradient(520px 320px at 50% 0%, rgba(53,232,255,.07), transparent 70%),
      radial-gradient(520px 360px at 50% 100%, rgba(155,107,255,.06), transparent 70%),
      #000;
  }
  .wrap{width:100%; max-width:440px}

  /* خط‌های نئونی به‌جای کارت */
  .line{
    height:1px; border:0; margin:26px 0;
    background:linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
    box-shadow:0 0 10px rgba(53,232,255,.55), 0 0 22px rgba(155,107,255,.35);
    opacity:.85;
  }

  /* آیکون سه‌بعدی کلی‌مورفیسم + گلوی نئونی */
  .clay{
    --c:var(--cyan);
    width:54px; height:54px; border-radius:19px; flex:none; display:grid; place-items:center;
    background:linear-gradient(145deg,#1c2436 0%,#090c14 70%);
    box-shadow:
      9px 9px 18px rgba(0,0,0,.95),
      -5px -5px 12px rgba(110,140,255,.10),
      inset 2px 2px 5px rgba(255,255,255,.14),
      inset -5px -5px 10px rgba(0,0,0,.85),
      0 0 20px color-mix(in srgb, var(--c) 38%, transparent);
  }
  .clay svg{
    width:26px; height:26px; fill:none; stroke:var(--c); stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 0 5px var(--c)) drop-shadow(0 0 12px color-mix(in srgb, var(--c) 60%, transparent));
  }
  .clay.big{width:68px;height:68px;border-radius:24px}
  .clay.big svg{width:34px;height:34px}

  .head{display:flex; align-items:center; gap:16px}
  .who{flex:1; min-width:0}
  .who h1{
    margin:0; font-size:23px; letter-spacing:.6px;
    text-shadow:0 0 14px rgba(53,232,255,.55);
  }
  .who p{margin:5px 0 0; color:var(--muted); font-size:14px; direction:ltr; text-align:right}
  .who p .dot{color:var(--green); text-shadow:0 0 8px var(--green)}

  .links{display:flex; flex-direction:column}
  .link{
    display:flex; align-items:center; gap:16px; padding:14px 0;
    color:var(--text); text-decoration:none;
    border-bottom:1px solid rgba(155,107,255,.22);
  }
  .link:last-child{border-bottom:0}
  .link .t{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .link .t b{font-weight:600; font-size:15px}
  .link .t i{font-style:normal; direction:ltr; text-align:right; color:var(--muted); font-size:13px; overflow-wrap:anywhere}
  .link .go{width:18px; height:18px; stroke:var(--muted); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; transform:scaleX(-1)}
  .link:active .clay{transform:translateY(1px) scale(.97)}

  h2{font-size:17px; margin:0 0 6px; text-shadow:0 0 12px rgba(155,107,255,.5)}
  .hint{color:var(--muted); font-size:14px; line-height:1.9; margin:0}

  .verify{text-align:center}
  .orb{
    --c:var(--cyan);
    width:156px; height:156px; border-radius:50%; margin:22px auto 14px; cursor:pointer; font:inherit;
    display:grid; place-items:center; border:2px solid var(--cyan);
    background:radial-gradient(circle at 32% 28%, #263250 0%, #0b0f1c 62%, #04060b 100%);
    box-shadow:
      12px 14px 26px rgba(0,0,0,.95),
      -6px -6px 16px rgba(110,140,255,.12),
      inset 3px 3px 8px rgba(255,255,255,.14),
      inset -8px -8px 16px rgba(0,0,0,.85),
      0 0 26px rgba(53,232,255,.55), 0 0 60px rgba(53,232,255,.25);
    animation:pulse 3.2s ease-in-out infinite;
  }
  .orb svg{width:66px;height:66px;fill:none;stroke:var(--cyan);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 6px var(--cyan)) drop-shadow(0 0 16px rgba(53,232,255,.7))}
  .orb:disabled{opacity:.6; cursor:wait; animation:none}
  @keyframes pulse{50%{box-shadow:12px 14px 26px rgba(0,0,0,.95),-6px -6px 16px rgba(110,140,255,.12),inset 3px 3px 8px rgba(255,255,255,.14),inset -8px -8px 16px rgba(0,0,0,.85),0 0 36px rgba(53,232,255,.8),0 0 84px rgba(155,107,255,.35)}}
  @media (prefers-reduced-motion: reduce){.orb{animation:none}}
  .vlabel{color:var(--cyan); font-size:18px; font-weight:600; text-shadow:0 0 12px rgba(53,232,255,.7)}
  .vsub{color:var(--muted); font-size:13px; margin-top:6px}
  .status{min-height:22px; margin-top:14px; font-size:14px}
  .status.ok{color:var(--green); text-shadow:0 0 10px rgba(77,255,176,.6)} .status.err{color:var(--err)}
  .reset{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;margin-top:10px;cursor:pointer}
  .reset[hidden]{display:none}

  #private{display:none}
  #private.show{display:block}
  .row{display:flex; justify-content:space-between; gap:14px; padding:13px 0; border-bottom:1px solid rgba(53,232,255,.18); font-size:15px}
  .row b{color:var(--muted); font-weight:500}
  .row span{text-align:left; overflow-wrap:anywhere}
  .mapbox{margin-top:16px}
  .mapbox[hidden]{display:none}
  .mapbox iframe{
    width:100%; height:230px; border:0; border-radius:22px; display:block; margin-bottom:6px; background:#0a0d16;
    box-shadow:0 0 0 1px rgba(53,232,255,.45), 0 0 24px rgba(53,232,255,.30), 10px 12px 24px rgba(0,0,0,.9);
    filter:invert(.92) hue-rotate(180deg) saturate(.8) brightness(.95);
  }

  .foot{margin-top:6px; color:var(--muted); font-size:12px; line-height:1.9; display:flex; gap:10px; align-items:flex-start}
  .foot .clay{width:30px;height:30px;border-radius:11px;--c:var(--green)}
  .foot .clay svg{width:15px;height:15px}
</style>
</head>
<body>
<main class="wrap">

  <header class="head">
    <div class="clay big" style="--c:var(--cyan)" id="logo"></div>
    <div class="who">
      <h1 id="name">NONONICK ID</h1>
      <p><span class="dot">●</span> <span id="tagline">Personal Digital Identity</span></p>
    </div>
  </header>

  <hr class="line">

  <nav class="links" id="links" aria-label="لینک‌ها"></nav>

  <hr class="line">

  <section id="gate" class="verify">
    <h2>تأیید هویت</h2>
    <p class="hint">برای دیدن آدرس و نقشه، با گوشی‌ات تأیید کن (Face ID، اثر انگشت یا قفل دستگاه).</p>
    <button class="orb" id="verifyBtn" aria-label="Verify with Passkey"></button>
    <div class="vlabel">Verify with Passkey</div>
    <div class="vsub">Your biometric data stays on your device</div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <button class="reset" id="resetBtn" hidden>حذف Passkey این دستگاه</button>
  </section>

  <section id="private" aria-label="آدرس و نقشه">
    <hr class="line">
    <h2>آدرس</h2>
    <div id="rows"></div>
    <div class="mapbox" id="mapbox" hidden>
      <iframe id="mapframe" title="نقشه" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      <a id="maplink" class="link" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <hr class="line">

  <div class="foot">
    <div class="clay" id="lockIcon"></div>
    <span>تأیید فقط روی همین دستگاه انجام می‌شود و اثر انگشت یا تصویر چهره به هیچ سروری ارسال نمی‌شود.</span>
  </div>

</main>

<script>
/* ============ فقط این بخش را ویرایش کن ============ */
const CONFIG = {
  name: "علیرضا",
  title: "Founder of Nononick",
  /* لینک‌های عمومی (همیشه دیده می‌شوند). icon: globe | phone | mail | github | repo | map */
  links: [
    { icon: "globe",  color: "cyan",   label: "وب‌سایت Nononick", sub: "nononick.ir", href: "https://nononick.ir" },
    { icon: "phone",  color: "green",  label: "تلفن", sub: "+98 912 849 6948", href: "tel:+989128496948" },
    { icon: "mail",   color: "violet", label: "ایمیل کاری", sub: "hello@nononick.ir", href: "mailto:hello@nononick.ir" },
    { icon: "mail",   color: "pink",   label: "ایمیل شخصی", sub: "alirezassezar.1@gmail.com", href: "mailto:alirezassezar.1@gmail.com" },
    { icon: "github", color: "amber",  label: "گیت‌هاب", sub: "github.com/alirezassezar1-svg", href: "https://github.com/alirezassezar1-svg" },
    { icon: "repo",   color: "cyan",   label: "ریپوی این کارت", sub: "github.com/alirezassezar1-svg/Hello-AI", href: "https://github.com/alirezassezar1-svg/Hello-AI" }
  ],
  /* بعد از تأیید Passkey نمایش داده می‌شود. خالی = نمایش داده نمی‌شود */
  private: [
    { label: "آدرس", value: "Andimeshk, Khuzestan Province" }
  ],
  /* نقشه‌ی گوگل (بعد از تأیید هویت). query خالی = بدون نقشه */
  map: { query: "Andimeshk, Khuzestan Province, Iran", label: "مسیریابی در Google Maps" }
};
/* =================================================== */

const $ = (id) => document.getElementById(id);
const KEY = "nononick-id-passkey";

const ICONS = {
  globe:  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/>',
  phone:  '<path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  mail:   '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/>',
  github: '<path d="M9 19c-5 1.500-5-2.500-7-3m14 6v-3.870a3.370 3.370 0 0 0-.94-2.610c3.140-.35 6.440-1.540 6.440-7A5.440 5.440 0 0 0 20 4.770 5.070 5.070 0 0 0 19.910 1S18.730.65 16 2.480a13.380 13.380 0 0 0-7 0C6.270.65 5.090 1 5.090 1A5.070 5.070 0 0 0 5 4.770a5.440 5.440 0 0 0-1.500 3.780c0 5.420 3.300 6.610 6.440 7A3.370 3.370 0 0 0 9 18.130V22"/>',
  repo:   '<path d="M4 5a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0-2 2z"/><path d="M4 20a2 2 0 0 1 2-2h12"/>',
  map:    '<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.500"/>',
  lock:   '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  finger: '<path d="M12 11c0 3-1 5.500-2.500 7.500"/><path d="M8 8.500A5 5 0 0 1 17 11c0 2.500-.5 4.500-1.500 6.500"/><path d="M5 11a7 7 0 0 1 11-5.700"/><path d="M5 15c.4-1.300.6-2.600.6-4"/><path d="M19 12c0 2.200-.3 4-1 5.500"/>',
  go:     '<path d="M9 6l6 6-6 6"/>'
};
const svg = (name) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';

$("logo").innerHTML = svg("finger");
$("verifyBtn").innerHTML = svg("finger");
$("lockIcon").innerHTML = svg("lock");
$("name").textContent = CONFIG.name + " · NONONICK ID";
$("tagline").textContent = CONFIG.title;

function linkEl(l, tag){
  const a = document.createElement("a");
  a.className = "link"; a.href = l.href;
  if(l.href.startsWith("http")){ a.target = "_blank"; a.rel = "noopener"; }
  const clay = document.createElement("div");
  clay.className = "clay"; clay.style.setProperty("--c", "var(--" + (l.color || "cyan") + ")");
  clay.innerHTML = svg(l.icon);
  const t = document.createElement("div"); t.className = "t";
  const b = document.createElement("b"); b.textContent = l.label;
  const i = document.createElement("i"); i.textContent = l.sub;
  t.append(b, i);
  const go = document.createElement("span"); go.innerHTML = '<svg class="go" viewBox="0 0 24 24" aria-hidden="true">' + ICONS.go + '</svg>';
  a.append(clay, t, go);
  return a;
}
CONFIG.links.forEach(l => $("links").append(linkEl(l)));

const rows = CONFIG.private.filter(r => r.value);
rows.forEach(r => {
  const d = document.createElement("div"); d.className = "row";
  const b = document.createElement("b"); b.textContent = r.label;
  const v = document.createElement("span"); v.textContent = r.value;
  d.append(b, v); $("rows").append(d);
});

function showMap(){
  if(!(CONFIG.map && CONFIG.map.query)) return;
  const q = encodeURIComponent(CONFIG.map.query);
  $("mapframe").src = "https://maps.google.com/maps?q=" + q + "&z=12&output=embed";
  const ml = $("maplink");
  ml.replaceWith(Object.assign(linkEl({
    icon: "map", color: "green", label: CONFIG.map.label, sub: "Google Maps",
    href: "https://www.google.com/maps/search/?api=1&query=" + q
  }), { id: "maplink" }));
  $("mapbox").hidden = false;
}

const b64 = {
  enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))),
  dec: (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0))
};
const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));

function say(msg, kind){ const s = $("status"); s.textContent = msg; s.className = "status " + (kind || ""); }
function unlock(){
  $("private").classList.add("show");
  showMap();
  say("هویت تأیید شد ✓", "ok");
}
function refreshReset(){ $("resetBtn").hidden = !localStorage.getItem(KEY); }
refreshReset();

async function register(){
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: rnd(32),
    rp: { name: "NONONICK ID", id: location.hostname },
    user: { id: rnd(16), name: "nononick-owner", displayName: CONFIG.name },
    pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
    authenticatorSelection: { userVerification: "required", residentKey: "preferred" },
    timeout: 60000
  }});
  localStorage.setItem(KEY, b64.enc(cred.rawId));
}
async function verify(){
  await navigator.credentials.get({ publicKey: {
    challenge: rnd(32),
    allowCredentials: [{ type: "public-key", id: b64.dec(localStorage.getItem(KEY)) }],
    userVerification: "required",
    rpId: location.hostname,
    timeout: 60000
  }});
}

$("verifyBtn").addEventListener("click", async () => {
  if(!window.PublicKeyCredential || !navigator.credentials){
    say("مرورگر شما از Passkey پشتیبانی نمی‌کند.", "err"); return;
  }
  const btn = $("verifyBtn"); btn.disabled = true; say("");
  try{
    if(!localStorage.getItem(KEY)){
      say("اولین بار: در حال ساخت Passkey…");
      await register();
    }
    say("در حال تأیید با دستگاه…");
    await verify();
    unlock();
  }catch(e){
    say(e && e.name === "NotAllowedError" ? "تأیید لغو شد یا زمان آن تمام شد." : "خطا: " + (e && e.message || e), "err");
  }finally{
    btn.disabled = false; refreshReset();
  }
});
$("resetBtn").addEventListener("click", () => {
  localStorage.removeItem(KEY); $("private").classList.remove("show");
  $("mapframe").removeAttribute("src"); $("mapbox").hidden = true;
  say("Passkey این دستگاه حذف شد."); refreshReset();
});
</script>
</body>
</html>
